version: '3.8'
services:
  api:
    build: ./microservices-api # Carpeta donde está el Dockerfile de la API
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/anime_db
  
  frontend:
    build: ./microservices-frontend # Carpeta donde está el Dockerfile del Front-End
    ports:
      - "5001:5001"
    depends_on:
      - api # El Front-End no se ejecutará hasta que la API esté lista
  
  mongodb:
    image: mongo:latest
    container_name: mongodb #puerto de mongodb
    ports:
      - "27017:27017" # Volumen para persistir los datos
    volumes:
      - mongo_data:/data/db
    #environment:
      #MONGO_INITDB_ROOT_USERNAME: root
      #MONGO_INITDB_ROOT_PASSWORD: example

volumes:
  mongo_data:
